  enableEffort: true
  enableLsp: true
  maxEffort: high
  isolation:
    enabled: true
readLineNumbers: false
read:
  toolResultPreview: true
  renderMarkdown: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
plan:
  autosave: true
tui:
  codexResetFireworks: false
  textSizing: false
  tight: false
  colorfulMarkdown: true
  motion: full
  reactions: false
error:
  notify: "off"
astGrep:
  enabled: true
update:
  auto: false
hideThinkingBlock: false
dev:
  autoqaConsent: granted
worktree:
  clone: false
todo:
  enabled: false
debug:
  enabled: true
github:
  enabled: true
checkpoint:
  enabled: true
providers:
  openaiLiveSteering: true
  openaiResponsesWebsockets: false
eval:
  py: true
bashInterceptor:
  enabled: true
extensionRenderers:
  transcriptPresenters: true
startup:
  quiet: true